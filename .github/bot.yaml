name: Kick Notification Bot

on:
  schedule:
    - cron: '0 */5 * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Configurar o Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Criar ficheiros JSON caso não existam
        run: |
          if [ ! -f streamers.json ]; then echo "[]" > streamers.json; fi
          if [ ! -f live_status.json ]; then echo "{}" > live_status.json; fi

      - name: Executar o Bot
        run: python kick_bot.py

      - name: Salvar alterações de streamers no GitHub
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add streamers.json live_status.json || true
          git diff --quiet && git diff --staged --quiet || git commit -m "Atualizando dados dos streamers [skip ci]"
          git push || true
